<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qualytree Guides</title>
<meta name="description" content="Qualytree guided tours — sign-up, onboarding, quality documents, inspection entry, change control.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--ground:#f6f4ee;--paper:#fff;--ink:#1a1f1c;--ink-2:#4b544f;--ink-3:#7d8781;--line:#e3e0d6;--forest:#0f3d2e;--forest-2:#17553f;--amber:#c98b2a}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font-family:"Noto Sans KR",-apple-system,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:28px 16px 56px}
.hd{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
h1{margin:4px 0 6px;font-family:Fraunces,serif;font-weight:600;font-size:30px;color:var(--forest);letter-spacing:-.02em}
h1 span{font-family:"Noto Sans KR",sans-serif;font-size:20px;font-weight:700;color:var(--ink);margin-left:6px}
.lead{color:var(--ink-2);max-width:62ch;margin:0 0 22px;font-size:14px}
.langbtn{flex:0 0 auto;font-family:"JetBrains Mono",monospace;font-size:11.5px;letter-spacing:.06em;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);cursor:pointer;margin-top:16px}
.langbtn:hover{border-color:var(--forest);color:var(--forest)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px 18px}
.card{text-decoration:none;color:inherit;display:block}
.thumb{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#0b1a14;box-shadow:0 10px 30px rgba(6,20,14,.22);transition:transform .2s ease,box-shadow .2s ease}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.28),rgba(0,0,0,0) 45%)}
.play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:transform .2s ease,background .2s ease}
.play svg{width:26px;height:26px;margin-left:4px;fill:var(--forest)}
.dur{position:absolute;right:10px;bottom:10px;z-index:2;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:#fff;background:rgba(0,0,0,.62);padding:2px 7px;border-radius:5px;letter-spacing:.04em}
.card:hover .thumb{transform:translateY(-3px);box-shadow:0 16px 40px rgba(6,20,14,.3)}
.card:hover .play{transform:scale(1.08);background:#fff}
.card:focus-visible{outline:2px solid var(--amber);outline-offset:4px;border-radius:12px}
.cap{display:flex;align-items:baseline;gap:10px;margin-top:10px;padding:0 2px}
.cap h2{margin:0;font-size:15.5px;font-weight:700;line-height:1.35}
.card .sub{margin:3px 2px 0;font-size:12.5px;color:var(--ink-3)}
.card.locked .thumb img{filter:saturate(.55) brightness(.72)}
.card.locked .play{background:rgba(20,30,25,.78);color:#fff;font-size:24px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.card.locked:hover .play{background:rgba(20,30,25,.92)}
.badge{position:absolute;left:10px;top:10px;z-index:2;font-size:11.5px;font-weight:700;color:#1a1409;background:var(--amber);padding:3px 9px;border-radius:6px;letter-spacing:.02em}
.card.locked .cap h2{color:var(--ink-2)}
.sect{margin:30px 0 10px;font-size:13px;font-weight:700;color:var(--forest);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sect small{font-weight:400;color:var(--ink-3)}
.note{margin-top:26px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);font-size:13.5px;color:var(--ink-2)}
.note a{color:var(--forest);font-weight:700}
.back{font-size:13px;color:var(--ink-3);text-decoration:none}
.back:hover{color:var(--forest)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <div>
      <a class="back" href="/" id="back">← qualy-tree.com</a>
      <div class="eyebrow" style="margin-top:14px">Qualytree Platform · Guided Tours</div>
      <h1>Qualytree<span id="h1sub">Guides</span></h1>
    </div>
    <button class="langbtn" id="langbtn" type="button">한국어</button>
  </div>
  <p class="lead" id="lead"></p>
  <div class="grid">
    <a class="card" href="/tours/signup/">
      <div class="thumb"><img src="/tours/thumbs/signup.jpg" alt="" loading="lazy"><span class="play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span><span class="dur">1:38</span></div>
      <div class="cap"><h2 data-t="t0"></h2></div>
      <p class="sub" data-t="s0"></p>
    </a>
  </div>
  <div class="sect"><span data-t="sect"></span> <small data-t="sectSub"></small></div>
  <div class="grid">
    <a class="card locked" href="/tours/onboarding/">
      <div class="thumb"><img src="/tours/thumbs/onboarding.jpg" alt="" loading="lazy"><span class="badge" data-t="badge"></span><span class="play">🔒</span><span class="dur">1:34</span></div>
      <div class="cap"><h2 data-t="t1"></h2></div>
      <p class="sub" data-t="sub"></p>
    </a>
    <a class="card locked" href="/tours/documents/">
      <div class="thumb"><img src="/tours/thumbs/documents.jpg" alt="" loading="lazy"><span class="badge" data-t="badge"></span><span class="play">🔒</span><span class="dur">1:45</span></div>
      <div class="cap"><h2 data-t="t2"></h2></div>
      <p class="sub" data-t="sub"></p>
    </a>
    <a class="card locked" href="/tours/inspection/">
      <div class="thumb"><img src="/tours/thumbs/inspection.jpg" alt="" loading="lazy"><span class="badge" data-t="badge"></span><span class="play">🔒</span><span class="dur">1:42</span></div>
      <div class="cap"><h2 data-t="t3"></h2></div>
      <p class="sub" data-t="sub"></p>
    </a>
    <a class="card locked" href="/tours/change-control/">
      <div class="thumb"><img src="/tours/thumbs/change-control.jpg" alt="" loading="lazy"><span class="badge" data-t="badge"></span><span class="play">🔒</span><span class="dur">1:38</span></div>
      <div class="cap"><h2 data-t="t4"></h2></div>
      <p class="sub" data-t="sub"></p>
    </a>
  </div>
  <p class="note" id="note"></p>
</div>
<script>
(function(){
  var T = {
    en: {
      sub2:'Guides', lead:'Short guided tours through the real product screens. The sign-up walkthrough is open to everyone; the other four can be previewed. <b>Captions are in Korean.</b>',
      t0:'Sign-up walkthrough', s0:'Open to everyone · plays on click',
      sect:'Available after sign-up', sectSub:'— full versions in the Guides menu inside the platform',
      badge:'🔒 Customers', sub:'20-second preview · full version after sign-up',
      t1:'Onboarding — 5 steps', t2:'Quality documents — drafting to approval', t3:'Inspection entry', t4:'Editing values & change control',
      note:'🔒 marked guides show the opening section only. With an approved company account you can watch all four in full (6 min 39 s total) from the <b>Guides</b> menu inside the platform. <a href="/signup">Request an account →</a>',
      back:'← qualy-tree.com', toggle:'한국어', title:'Qualytree Guides'
    },
    ko: {
      sub2:'사용 안내', lead:'실제 화면을 따라가는 1~2분 안내 영상입니다. 가입 안내는 전체 공개, 나머지 네 편은 앞부분만 미리 볼 수 있습니다.',
      t0:'가입 안내', s0:'전체 공개 · 누르면 바로 재생',
      sect:'가입 후 제공되는 안내', sectSub:'— 플랫폼 안의 ‘사용 안내’ 메뉴에서 전체 재생',
      badge:'🔒 가입자 전용', sub:'앞부분 20초 미리보기 · 전체는 가입 후 제공',
      t1:'온보딩 5단계', t2:'품질문서 작성과 승인', t3:'검사 단계 입력', t4:'입력값 수정과 변경관리',
      note:'🔒 표시된 안내는 앞부분만 미리 볼 수 있습니다. 승인된 회사 계정으로 로그인하면 플랫폼의 <b>사용 안내</b> 메뉴에서 네 편 전체(총 6분 39초)를 볼 수 있습니다. <a href="/signup">회사 계정 신청 →</a>',
      back:'← qualy-tree.com', toggle:'ENGLISH', title:'Qualytree 사용 안내'
    }
  };
  var q = new URLSearchParams(location.search).get('lang'), lang = 'en';
  if (q === 'ko' || q === 'en') lang = q;
  else { try { var v = localStorage.getItem('qt.lang'); if (v === 'ko' || v === 'en') lang = v; } catch (e) {} }
  function apply(){
    var d = T[lang];
    document.documentElement.lang = lang;
    document.title = d.title;
    document.getElementById('h1sub').textContent = d.sub2;
    document.getElementById('lead').innerHTML = d.lead;
    document.getElementById('note').innerHTML = d.note;
    document.getElementById('back').textContent = d.back;
    document.getElementById('langbtn').textContent = d.toggle;
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function(el){
      var k = el.getAttribute('data-t'); if (d[k] != null) el.textContent = d[k];
    });
    Array.prototype.forEach.call(document.querySelectorAll('.card.locked'), function(a){
      a.title = lang === 'en' ? 'Full version available after sign-up' : '가입 후 전체를 볼 수 있습니다';
    });
  }
  apply();
  document.getElementById('langbtn').addEventListener('click', function(){
    lang = lang === 'en' ? 'ko' : 'en';
    try { localStorage.setItem('qt.lang', lang); } catch (e) {}
    apply();
  });
})();
</script>
</body>
</html>
